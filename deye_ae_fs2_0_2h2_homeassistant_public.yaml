# Deye AE-FS2.0-2H2 - Home Assistant native Modbus integration
# Read-only sensors. No private addresses, logger IDs or credentials.
# Add this block to configuration.yaml (or merge under existing modbus:).
# Requires deye_modbus_host in secrets.yaml. Adjust slave and port to your setup.
# Addresses are zero-based FC03 holding registers.
modbus:
  - name: deye_ae_fs2_0_2h2
    type: tcp
    host: !secret deye_modbus_host
    port: 502
    timeout: 5
    sensors:
      - name: "Deye Bms Charge Voltage"
        unique_id: deye_ae_fs2_0_2h2_bms_charge_voltage
        address: 372
        input_type: holding
        slave: 1
        data_type: uint16
        scan_interval: 10
        scale: 0.01
        unit_of_measurement: "V"
        state_class: measurement
        device_class: voltage
      - name: "Deye Bms Charge Current Limit"
        unique_id: deye_ae_fs2_0_2h2_bms_charge_current_limit
        address: 374
        input_type: holding
        slave: 1
        data_type: uint16
        scan_interval: 10
        unit_of_measurement: "A"
        state_class: measurement
        device_class: current
      - name: "Deye Bms Discharge Current Limit"
